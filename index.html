<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>推しNDCメーカー</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f1e7;
      --panel: rgba(255, 252, 246, .94);
      --ink: #082647;
      --gold: #b78945;
      --shadow: 0 18px 48px rgba(39, 30, 17, .13);
      --radius: 22px;
      --line: rgba(183, 137, 69, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #263545;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.95), transparent 32%),
        linear-gradient(135deg, #fbf7ef 0%, var(--bg) 50%, #efe2cf 100%);
      font-family: "Zen Kaku Gothic New", sans-serif;
    }

    a {
      color: #0c4a86;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 42px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      letter-spacing: .06em;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      line-height: 1.8;
      font-size: .98rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel,
    .preview-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 22px;
      position: sticky;
      top: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: .04em;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(183, 137, 69, .42);
      border-radius: 14px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fffdf8;
      font: inherit;
      outline: none;
      font-size: 1.2rem;
      letter-spacing: .06em;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(183, 137, 69, .14);
    }

    .radio-group {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(183, 137, 69, .28);
      border-radius: 14px;
      background: #fffdf8;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      margin: 0;
      accent-color: #0c2d52;
      transform: scale(1.1);
      flex: 0 0 auto;
    }

    .radio-option span {
      font-size: .98rem;
      color: var(--ink);
    }

    .hint {
      margin: 8px 0 0;
      color: #7a6c5c;
      font-size: .86rem;
      line-height: 1.65;
    }

    .status {
      margin: 14px 0 0;
      min-height: 1.6em;
      color: #805d26;
      font-size: .9rem;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      cursor: pointer;
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-weight: 700;
      letter-spacing: .06em;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .46; cursor: not-allowed; transform: none; }

    .primary {
      color: white;
      background: linear-gradient(135deg, #0c2d52, #061c35);
      box-shadow: 0 10px 22px rgba(6, 28, 53, .23);
    }

    .secondary {
      color: var(--ink);
      background: #fffaf0;
      border: 1px solid rgba(183, 137, 69, .36);
    }

    .preview-wrap {
      padding: 16px;
      overflow: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: #fffaf2;
    }

    .footer-notes {
      margin-top: 26px;
      text-align: center;
      font-size: .93rem;
      line-height: 1.95;
      color: #54473b;
    }

    .footer-notes p {
      margin: 0 0 8px;
    }

    .footer-notes p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .panel { position: static; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>推しNDCメーカー</h1>
      <p class="lead">分類番号を入力すると、NDC番号と分類内容をカード画像に合成して保存できます。</p>
    </header>

    <div class="layout">
      <section class="panel" aria-label="入力欄">
        <div class="field">
          <label>カードデザイン</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="template" value="classic" checked>
              <span>シンプル</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="template" value="librarian">
              <span>司書さんと探偵さん</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label for="ndcInput">分類番号</label>
          <input id="ndcInput" type="text" inputmode="numeric" autocomplete="off" value="913" placeholder="例：913">
          <p class="hint">3桁のNDCを入力してください。</p>
        </div>

        <div class="status" id="status">読み込み中です。</div>

        <div class="buttons">
          <button class="primary" id="downloadBtn" type="button">PNGで保存</button>
          <button class="secondary" id="postXBtn" type="button">Xへ投稿</button>
        </div>
      </section>

      <section class="preview-wrap" aria-label="カードプレビュー">
        <canvas id="cardCanvas" width="1648" height="928"></canvas>
      </section>
    </div>

    <section class="footer-notes" aria-label="クレジットと出典">
      <p>日本十進分類法のデータは「<a href="https://www.jla.or.jp/committees/bunrui/ndc-data/" target="_blank" rel="noopener noreferrer">日本図書館協会NDC9（CC BY)</a>」を使用させていただいています。</p>
      <p>カードデザイン・コーディングにChatGPTを用いています。</p>
      <p>推しNDCメーカー produced by <a href="https://yawatosho.hateblo.jp/" target="_blank" rel="noopener noreferrer">やわらか図書館学</a></p>
    </section>
  </main>

  <script>
    const NDC_JSON_URL = "https://raw.githubusercontent.com/Yawatosho/karuta/refs/heads/main/ndc.json";

    const TEMPLATE_MAP = {
      classic: "template_classic.png",
      librarian: "template_librarian.png"
    };

    const NUMBER_FONT = '"Libre Baskerville", serif';
    const JAPANESE_FONT = '"Zen Kaku Gothic New", sans-serif';

    const canvas = document.getElementById("cardCanvas");
    const ctx = canvas.getContext("2d");
    const ndcInput = document.getElementById("ndcInput");
    const templateRadios = document.querySelectorAll('input[name="template"]');
    const statusEl = document.getElementById("status");
    const downloadBtn = document.getElementById("downloadBtn");
    const postXBtn = document.getElementById("postXBtn");

    let templateImage = null;
    let ndcMap = new Map();
    let dataReady = false;
    let imageReady = false;

    const COLORS = {
      ink: "#082647",
      gold: "#b78945"
    };

    function getSelectedTemplate() {
      return document.querySelector('input[name="template"]:checked')?.value || "classic";
    }

    function normalizeNdc(value) {
      return String(value ?? "")
        .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/[^0-9]/g, "")
        .slice(0, 3);
    }

    function splitLabel(label) {
      const text = String(label || "").trim();
      if (!text) return "";
      return text
        .replace(/\s*[・･]\s*/g, "・")
        .replace(/\s+/g, " ");
    }

    function collectNdcEntries(node) {
      if (!node) return;

      if (Array.isArray(node)) {
        node.forEach(collectNdcEntries);
        return;
      }

      if (typeof node === "object") {
        const codeKeys = ["ndc", "NDC", "code", "number", "id", "分類番号", "class", "value"];
        const labelKeys = ["label", "name", "title", "subject", "category", "text", "分類", "分類内容", "description"];

        const code = codeKeys.map(k => node[k]).find(v => v !== undefined && v !== null && normalizeNdc(v).length === 3);
        const label = labelKeys.map(k => node[k]).find(v => typeof v === "string" && v.trim());

        if (code && label) {
          ndcMap.set(normalizeNdc(code), splitLabel(label));
        }

        for (const [key, value] of Object.entries(node)) {
          const keyCode = normalizeNdc(key);

          if (keyCode.length === 3 && typeof value === "string") {
            ndcMap.set(keyCode, splitLabel(value));
          } else if (keyCode.length === 3 && value && typeof value === "object") {
            const nestedLabel = labelKeys.map(k => value[k]).find(v => typeof v === "string" && v.trim());
            if (nestedLabel) ndcMap.set(keyCode, splitLabel(nestedLabel));
            collectNdcEntries(value);
          } else {
            collectNdcEntries(value);
          }
        }
      }
    }

    async function loadNdcData() {
      try {
        const res = await fetch(NDC_JSON_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("NDCデータを取得できませんでした。");
        const json = await res.json();
        ndcMap.clear();
        collectNdcEntries(json);
        dataReady = ndcMap.size > 0;
      } catch (error) {
        dataReady = false;
      }
      updateStatus();
      drawCard();
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    async function loadTemplate() {
      const templatePath = TEMPLATE_MAP[getSelectedTemplate()];
      try {
        templateImage = await loadImageFromUrl(templatePath);
        imageReady = true;
      } catch (error) {
        templateImage = null;
        imageReady = false;
      }
      updateStatus();
      drawCard();
    }

    function updateStatus() {
      const code = normalizeNdc(ndcInput.value);
      const label = ndcMap.get(code);

      if (!imageReady) {
        statusEl.textContent = "テンプレート画像を読み込めませんでした。ファイル名をご確認ください。";
      } else if (!dataReady) {
        statusEl.textContent = "NDCデータを読み込み中です。";
      } else if (code.length !== 3) {
        statusEl.textContent = "3桁の分類番号を入力してください。";
      } else if (!label) {
        statusEl.textContent = `${code} の分類内容が見つかりませんでした。`;
      } else {
        statusEl.textContent = `${code}：${label}`;
      }

      const canOutput = imageReady && code.length === 3;
      downloadBtn.disabled = !canOutput;
      postXBtn.disabled = !canOutput;
    }

    function fitText(text, maxWidth, initialSize, fontFamily, weight = 700, minSize = 30) {
      let size = initialSize;
      do {
        ctx.font = `${weight} ${size}px ${fontFamily}`;
        if (ctx.measureText(text).width <= maxWidth) return size;
        size -= 2;
      } while (size >= minSize);
      return minSize;
    }

    function drawCenteredText(text, x, y, options = {}) {
      const {
        fontSize = 80,
        fontFamily = JAPANESE_FONT,
        weight = 700,
        color = COLORS.ink,
        letterSpacing = 0,
        maxWidth = Infinity,
        baseline = "middle",
        minSize = 24
      } = options;

      const fittedSize = fitText(text, maxWidth, fontSize, fontFamily, weight, minSize);
      ctx.font = `${weight} ${fittedSize}px ${fontFamily}`;
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = baseline;

      if (!letterSpacing) {
        ctx.fillText(text, x, y);
        return;
      }

      const chars = [...text];
      const widths = chars.map(ch => ctx.measureText(ch).width);
      const totalWidth = widths.reduce((a, b) => a + b, 0) + letterSpacing * Math.max(0, chars.length - 1);
      let currentX = x - totalWidth / 2;
      ctx.textAlign = "left";
      for (let i = 0; i < chars.length; i++) {
        ctx.fillText(chars[i], currentX, y);
        currentX += widths[i] + letterSpacing;
      }
      ctx.textAlign = "center";
    }

    function drawTopNumber(code) {
      drawCenteredText(code, 969, 132, {
        fontSize: 72,
        minSize: 40,
        fontFamily: NUMBER_FONT,
        weight: 700,
        color: COLORS.gold,
        maxWidth: 200,
        baseline: "middle"
      });
    }

    function drawCard() {
      const code = normalizeNdc(ndcInput.value) || "---";
      const label = ndcMap.get(code) || "";

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (templateImage) {
        ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#fffaf1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#d5b47c";
        ctx.lineWidth = 2;
        ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);
      }

      drawTopNumber(code);

      drawCenteredText(code, 824, 446, {
        fontSize: 410,
        minSize: 260,
        fontFamily: NUMBER_FONT,
        weight: 700,
        color: COLORS.ink,
        maxWidth: 860,
        baseline: "middle"
      });

      drawCenteredText(label || "分類内容", 824, 748, {
        fontSize: 82,
        minSize: 36,
        fontFamily: JAPANESE_FONT,
        weight: 700,
        color: COLORS.ink,
        letterSpacing: label && label.length <= 8 ? 10 : 3,
        maxWidth: 980,
        baseline: "middle"
      });
    }

    function downloadPng() {
      drawCard();
      const code = normalizeNdc(ndcInput.value) || "ndc";
      const link = document.createElement("a");
      link.download = `oshi-ndc-${code}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function postToX() {
      const code = normalizeNdc(ndcInput.value) || "---";
      const postText = `私の推しNDCは${code}です！\n#推しNDCメーカー\n${location.href}`;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(postText)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    ndcInput.addEventListener("input", () => {
      const normalized = normalizeNdc(ndcInput.value);
      if (ndcInput.value !== normalized) ndcInput.value = normalized;
      updateStatus();
      drawCard();
    });

    templateRadios.forEach(radio => {
      radio.addEventListener("change", loadTemplate);
    });

    downloadBtn.addEventListener("click", downloadPng);
    postXBtn.addEventListener("click", postToX);

    async function init() {
      downloadBtn.disabled = true;
      postXBtn.disabled = true;
      await document.fonts.ready;
      loadTemplate();
      loadNdcData();
    }

    init();
  </script>
</body>
</html>
